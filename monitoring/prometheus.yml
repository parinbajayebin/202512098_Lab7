global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8080", "host.docker.internal:8080"]

  - job_name: "user-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["user-service:3001", "host.docker.internal:3001"]

  - job_name: "product-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["product-service:3002", "host.docker.internal:3002"]

  - job_name: "order-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["order-service:3003", "host.docker.internal:3003"]

