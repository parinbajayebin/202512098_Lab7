<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background-color: #0b1120; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="productGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="promGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="575" y="42" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Lab 8 Architecture: Kubernetes, CI/CD &amp; Prometheus/Grafana Monitoring</text>
  <text x="575" y="66" fill="#94a3b8" font-size="13" text-anchor="middle">CampusConnect Microservices • Namespace: lab8 • GitHub Actions CI/CD • Observability Stack</text>

  <!-- Outer K8s Cluster Boundary -->
  <rect x="230" y="90" width="670" height="700" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="245" y="100" width="220" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#60a5fa" font-size="12" font-weight="600">☸️ Kubernetes Cluster (namespace: lab8)</text>

  <!-- External Client / Postman -->
  <g transform="translate(30, 200)" filter="url(#shadow)">
    <rect width="150" height="90" rx="12" fill="url(#clientGrad)"/>
    <text x="75" y="38" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Client / Postman</text>
    <text x="75" y="58" fill="#e0f2fe" font-size="11" text-anchor="middle">External Consumer</text>
    <text x="75" y="74" fill="#bae6fd" font-size="10" text-anchor="middle">HTTP :30080 / :8080</text>
  </g>

  <!-- CI/CD GitHub Actions Box -->
  <g transform="translate(30, 420)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="url(#cicdGrad)"/>
    <text x="75" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions</text>
    <text x="75" y="52" fill="#f3e8ff" font-size="11" text-anchor="middle">CI/CD Pipeline</text>
    <text x="75" y="70" fill="#e9d5ff" font-size="10" text-anchor="middle">1. Build &amp; Test (npm)</text>
    <text x="75" y="86" fill="#e9d5ff" font-size="10" text-anchor="middle">2. Docker Build + SHA</text>
    <text x="75" y="100" fill="#d8b4fe" font-size="10" text-anchor="middle">3. Push to GHCR</text>
  </g>

  <!-- Client -> Gateway Arrow -->
  <path d="M 180 245 L 260 245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="220" y="235" fill="#38bdf8" font-size="10" text-anchor="middle">NodePort</text>

  <!-- K8s Gateway Service & Pod -->
  <g transform="translate(265, 170)" filter="url(#shadow)">
    <rect width="210" height="150" rx="12" fill="url(#gatewayGrad)"/>
    <rect x="10" y="10" width="190" height="24" rx="6" fill="#312e81"/>
    <text x="105" y="27" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">SVC: gateway-service:8080</text>
    <text x="105" y="60" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">API Gateway Pod</text>
    <text x="105" y="80" fill="#e0e7ff" font-size="11" text-anchor="middle">Single Ingress &amp; Reverse Proxy</text>
    <text x="105" y="100" fill="#a5b4fc" font-size="10" text-anchor="middle">Probes: /health (Liveness/Ready)</text>
    <text x="105" y="118" fill="#a5b4fc" font-size="10" text-anchor="middle">Metrics: /metrics (Prometheus)</text>
    <text x="105" y="136" fill="#818cf8" font-size="10" text-anchor="middle">NodePort: 30080</text>
  </g>

  <!-- CI/CD -> K8s Deployment Arrow -->
  <path d="M 180 475 L 265 290" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <text x="210" y="380" fill="#c084fc" font-size="10" text-anchor="middle">Rolling Update</text>

  <!-- ConfigMap -->
  <g transform="translate(265, 345)" filter="url(#shadow)">
    <rect width="210" height="60" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="105" y="24" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">ConfigMap: lab8-config</text>
    <text x="105" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Internal URLs, Ports, NODE_ENV</text>
  </g>

  <!-- Gateway -> Microservices Arrows -->
  <path d="M 475 220 L 560 170" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <path d="M 475 245 L 560 300" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <path d="M 475 270 L 560 430" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- User Service Pods (Scaled to 3 Replicas) -->
  <g transform="translate(565, 120)" filter="url(#shadow)">
    <rect width="290" height="110" rx="12" fill="url(#userGrad)"/>
    <rect x="10" y="8" width="270" height="22" rx="6" fill="#064e3b"/>
    <text x="145" y="24" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">SVC: user-service:3001 (ClusterIP)</text>
    <text x="145" y="50" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">User Service (3 Replicas)</text>
    <text x="145" y="70" fill="#d1fae5" font-size="11" text-anchor="middle">Pods: user-service-xx (Self-Healing)</text>
    <text x="145" y="90" fill="#a7f3d0" font-size="10" text-anchor="middle">Scaled via: kubectl scale --replicas=3</text>
    <text x="145" y="102" fill="#6ee7b7" font-size="10" text-anchor="middle">Probes: /health | Port 3001</text>
  </g>

  <!-- Product Service Pod -->
  <g transform="translate(565, 250)" filter="url(#shadow)">
    <rect width="290" height="100" rx="12" fill="url(#productGrad)"/>
    <rect x="10" y="8" width="270" height="22" rx="6" fill="#78350f"/>
    <text x="145" y="24" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">SVC: product-service:3002 (ClusterIP)</text>
    <text x="145" y="50" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Product Service Pod</text>
    <text x="145" y="70" fill="#fef3c7" font-size="11" text-anchor="middle">Catalog &amp; Inventory Management</text>
    <text x="145" y="90" fill="#fde68a" font-size="10" text-anchor="middle">Probes: /health | Port 3002</text>
  </g>

  <!-- Order Service Pod -->
  <g transform="translate(565, 375)" filter="url(#shadow)">
    <rect width="290" height="120" rx="12" fill="url(#orderGrad)"/>
    <rect x="10" y="8" width="270" height="22" rx="6" fill="#831843"/>
    <text x="145" y="24" fill="#fbcfe8" font-size="11" font-weight="600" text-anchor="middle">SVC: order-service:3003 (ClusterIP)</text>
    <text x="145" y="50" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Order Service Pod</text>
    <text x="145" y="70" fill="#fdf2f8" font-size="11" text-anchor="middle">Cross-Service Orchestration</text>
    <text x="145" y="90" fill="#fbcfe8" font-size="10" text-anchor="middle">Inter-Service Calls to Users &amp; Products</text>
    <text x="145" y="108" fill="#f472b6" font-size="10" text-anchor="middle">Probes: /health | Port 3003</text>
  </g>

  <!-- Inter-service communication arrows -->
  <path d="M 855 420 C 890 420, 890 180, 855 180" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 855 440 C 880 440, 880 300, 855 300" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- ================= Observability Layer (Prometheus & Grafana) ================= -->
  <rect x="250" y="525" width="630" height="245" rx="12" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="265" y="548" fill="#fdba74" font-size="12" font-weight="700">📊 Observability Stack (Part C Monitoring)</text>

  <!-- Prometheus Pod -->
  <g transform="translate(265, 565)" filter="url(#shadow)">
    <rect width="280" height="120" rx="10" fill="url(#promGrad)"/>
    <text x="140" y="30" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Prometheus Server</text>
    <text x="140" y="50" fill="#ffedd5" font-size="11" text-anchor="middle">Scrapes /metrics every 5s</text>
    <text x="140" y="70" fill="#fed7aa" font-size="10" text-anchor="middle">Target: gateway-service:8080</text>
    <text x="140" y="88" fill="#fed7aa" font-size="10" text-anchor="middle">Queries: up, rate(http_requests_total)</text>
    <text x="140" y="106" fill="#ffedd5" font-size="10" text-anchor="middle">NodePort: 30090 / Port 9090</text>
  </g>

  <!-- Grafana Pod -->
  <g transform="translate(575, 565)" filter="url(#shadow)">
    <rect width="280" height="120" rx="10" fill="url(#grafanaGrad)"/>
    <text x="140" y="30" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Grafana Dashboard</text>
    <text x="140" y="50" fill="#fef9c3" font-size="11" text-anchor="middle">Visualizes 4 Core Questions</text>
    <text x="140" y="70" fill="#fef08a" font-size="10" text-anchor="middle">1. Availability (UP)  2. Traffic Rate</text>
    <text x="140" y="88" fill="#fef08a" font-size="10" text-anchor="middle">3. Error Rate (4xx/5xx) 4. Latency</text>
    <text x="140" y="106" fill="#fef9c3" font-size="10" text-anchor="middle">NodePort: 30300 / Port 3000</text>
  </g>

  <!-- Scrape arrow from Prometheus to Gateway -->
  <path d="M 370 565 L 370 320" stroke="#fb923c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
  <text x="315" y="470" fill="#fb923c" font-size="10">Scrape /metrics</text>

  <!-- Query arrow from Grafana to Prometheus -->
  <path d="M 575 625 L 545 625" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="560" y="615" fill="#fef08a" font-size="9" text-anchor="middle">PromQL</text>

  <!-- External DB: MongoDB Atlas -->
  <g transform="translate(940, 260)" filter="url(#shadow)">
    <rect width="180" height="120" rx="12" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="36" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">MongoDB Atlas</text>
    <text x="90" y="58" fill="#ecfdf5" font-size="11" text-anchor="middle">Managed Cloud DB</text>
    <text x="90" y="78" fill="#6ee7b7" font-size="10" text-anchor="middle">External to K8s Cluster</text>
    <text x="90" y="96" fill="#a7f3d0" font-size="10" text-anchor="middle">Persists Users / Products</text>
  </g>

  <!-- Arrow to Mongo -->
  <path d="M 855 310 L 940 310" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
</svg>

