.0apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'gateway'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['gateway-service:8080']

      - job_name: 'user-service'
        metrics_path: '/health'
        static_configs:
          - targets: ['user-service:3001']

      - job_name: 'product-service'
        metrics_path: '/health'
        static_configs:
          - targets: ['product-service:3002']

      - job_name: 'order-service'
        metrics_path: '/health'
        static_configs:
          - targets: ['order-service:3003']
